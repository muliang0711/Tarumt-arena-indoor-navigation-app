global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: presence-gateway
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: trajectory-worker
    static_configs:
      - targets: ["worker:9091"]

  - job_name: analytics-api
    static_configs:
      - targets: ["analytics-api:9092"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]
