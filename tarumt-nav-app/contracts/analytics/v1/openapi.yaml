openapi: 3.1.0
info:
  title: Campus Navigator Aggregate Analytics API
  version: 1.0.0
  description: Privacy-safe aggregate traffic queries. Individual trajectory and identity queries are forbidden.
paths:
  /v1/analytics/floor-traffic:
    get:
      operationId: getFloorTraffic
      parameters:
        - $ref: '#/components/parameters/BuildingId'
        - $ref: '#/components/parameters/FloorId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Bucket'
      responses:
        '200':
          description: Time-bucketed floor traffic with cohorts below the server privacy threshold omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloorTrafficReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/ResultTooLarge'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/analytics/route-edges:
    get:
      operationId: getRouteEdgeUsage
      parameters:
        - $ref: '#/components/parameters/BuildingId'
        - $ref: '#/components/parameters/FloorId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Bucket'
      responses:
        '200':
          description: Time-bucketed route-edge usage with small cohorts omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteEdgeReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/ResultTooLarge'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  parameters:
    BuildingId:
      name: building_id
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    FloorId:
      name: floor_id
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
    Bucket:
      name: bucket
      in: query
      required: true
      schema: { type: string, enum: [15m, 1h, 1d] }
  schemas:
    FloorTrafficPoint:
      type: object
      additionalProperties: false
      required: [bucket_start, journey_count, movement_event_count, traffic_level]
      properties:
        bucket_start: { type: string, format: date-time }
        journey_count: { type: integer, minimum: 5 }
        movement_event_count: { type: integer, minimum: 1 }
        traffic_level: { type: string, enum: [quiet, moderate, busy] }
    RouteEdgeUsage:
      type: object
      additionalProperties: false
      required: [bucket_start, from_node_id, to_node_id, journey_count, traversal_event_count, usage_rank]
      properties:
        bucket_start: { type: string, format: date-time }
        from_node_id: { type: string }
        to_node_id: { type: string }
        journey_count: { type: integer, minimum: 5 }
        traversal_event_count: { type: integer, minimum: 1 }
        usage_rank: { type: integer, minimum: 1 }
    FloorTrafficReport:
      type: object
      additionalProperties: false
      required: [building_id, floor_id, from, to, bucket, generated_at, points]
      properties:
        building_id: { type: string }
        floor_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucket: { type: string, enum: [15m, 1h, 1d] }
        generated_at: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: '#/components/schemas/FloorTrafficPoint' }
    RouteEdgeReport:
      type: object
      additionalProperties: false
      required: [building_id, floor_id, from, to, bucket, generated_at, edges]
      properties:
        building_id: { type: string }
        floor_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucket: { type: string, enum: [15m, 1h, 1d] }
        generated_at: { type: string, format: date-time }
        edges:
          type: array
          items: { $ref: '#/components/schemas/RouteEdgeUsage' }
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    BadRequest:
      description: Invalid or privacy-forbidden query.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Query concurrency limit reached.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ResultTooLarge:
      description: The aggregate result exceeds the server row bound; request a narrower time window.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Analytics warehouse unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
