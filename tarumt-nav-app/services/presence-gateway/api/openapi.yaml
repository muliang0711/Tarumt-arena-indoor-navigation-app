openapi: 3.1.0
info:
  title: Campus Navigator Presence Gateway HTTP API
  version: 1.0.0
  description: Anonymous sessions, immutable map delivery, and service health.
servers:
  - url: http://localhost:8080
paths:
  /v1/anonymous-sessions:
    post:
      operationId: createAnonymousSession
      summary: Create a temporary anonymous session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnonymousSessionRequest'
      responses:
        '201':
          description: Anonymous session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnonymousSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/maps/{map_id}/current:
    get:
      operationId: getCurrentMapBundle
      summary: Get the complete manifest for the current Map Bundle
      parameters:
        - $ref: '#/components/parameters/MapId'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Current Map Bundle manifest
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapBundleManifest'
        '304':
          description: The client's current bundle revision is unchanged
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/maps/{map_id}/revisions/{revision}/{asset_path}:
    get:
      operationId: getMapBundleAsset
      summary: Download one asset from an immutable Map Bundle revision
      parameters:
        - $ref: '#/components/parameters/MapId'
        - name: revision
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Sha256Revision'
        - name: asset_path
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,255}$'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Complete immutable asset
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: public, max-age=31536000, immutable
          content:
            application/json:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '206':
          description: Requested byte range of an immutable asset
        '304':
          description: The cached asset has the same digest
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Requested byte range cannot be satisfied
        '500':
          $ref: '#/components/responses/InternalError'
  /health/live:
    get:
      operationId: getLiveness
      summary: Process liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Service readiness
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  parameters:
    MapId:
      name: map_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
  schemas:
    Sha256Revision:
      type: string
      pattern: '^sha256:[a-f0-9]{64}$'
    MapBundleManifest:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - map_id
        - bundle_revision
        - graph_revision
        - assets
      properties:
        schema_version:
          type: integer
          const: 1
        map_id:
          type: string
        bundle_revision:
          $ref: '#/components/schemas/Sha256Revision'
        graph_revision:
          $ref: '#/components/schemas/Sha256Revision'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/MapBundleAsset'
    MapBundleAsset:
      type: object
      additionalProperties: false
      required:
        - asset_id
        - kind
        - path
        - sha256
        - byte_size
        - content_type
      properties:
        asset_id:
          type: string
        kind:
          type: string
          enum:
            - map_graph
            - rooms
            - map_raster
            - thumbnail
            - tiled_map
            - route_edges
            - nodes
            - wifi_node_mapping
        floor_id:
          type: string
        path:
          type: string
        sha256:
          $ref: '#/components/schemas/Sha256Revision'
        byte_size:
          type: integer
          minimum: 1
        content_type:
          type: string
          enum: [application/json, image/png]
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    CreateAnonymousSessionRequest:
      type: object
      additionalProperties: false
      required: [installation_id]
      properties:
        installation_id:
          type: string
          minLength: 16
          maxLength: 128
        display_name:
          type: string
          maxLength: 24
    CreateAnonymousSessionResponse:
      type: object
      required:
        - session_id
        - access_token
        - token_type
        - token_expires_at
        - session_expires_at
        - websocket_path
      properties:
        session_id:
          type: string
          format: uuid
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        token_expires_at:
          type: string
          format: date-time
        session_expires_at:
          type: string
          format: date-time
        websocket_path:
          type: string
          const: /v1/presence
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [live, ready]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal service failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
