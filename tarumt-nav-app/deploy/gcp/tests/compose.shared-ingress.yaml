# Isolated integration stack: no host ports or production volumes.
services:
  redis:
    extends: {file: ../../compose.admin-local.yaml, service: redis}
  clickhouse:
    extends: {file: ../../compose.admin-local.yaml, service: clickhouse}
  presence-gateway:
    extends: {file: ../../compose.admin-local.yaml, service: presence-gateway}
    ports: !reset []
    environment:
      PRESENCE_MAP_DATA_ROOT: /srv/campus-maps
    volumes:
      - ${VERIFY_MAP_ROOT:?set VERIFY_MAP_ROOT}:/srv/campus-maps:ro
  analytics-api:
    extends: {file: ../../compose.admin-local.yaml, service: analytics-api}
    ports: !reset []
  admin-web:
    build: ../../../admin-web
    environment:
      PRESENCE_API_BASE_URL: http://presence-gateway:8080
      ANALYTICS_API_BASE_URL: http://analytics-api:9092
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
  proxy:
    image: caddy:2
    environment:
      FRONTEND_DOMAIN: http://proxy:8081
    volumes:
      - ../../frontend.Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      admin-web: {condition: service_healthy}
      presence-gateway: {condition: service_healthy}
      analytics-api: {condition: service_healthy}
volumes:
  admin-analytics:
networks:
  default:
    internal: true
