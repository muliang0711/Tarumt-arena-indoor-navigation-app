global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: presence-gateway
    static_configs:
      - targets: ["presence-gateway:8080"]

  - job_name: trajectory-worker
    static_configs:
      - targets: ["trajectory-worker:9091"]

  - job_name: analytics-api
    static_configs:
      - targets: ["analytics-api:9092"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
